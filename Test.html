<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Tracker PWA Check</title><style>body{font-family:system-ui;margin:0;background:#061a3a;color:#eef6ff;padding:20px}main{max-width:820px;margin:auto}h1{font-size:24px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px;margin:8px 0;border:1px solid #285d91;border-radius:12px;background:#09264c}.ok{color:#6ee7b7}.bad{color:#fca5a5}.warn{color:#fde68a}pre{white-space:pre-wrap;word-break:break-word;background:#020b18;padding:12px;border-radius:10px}button{padding:12px 16px;border:0;border-radius:10px;background:#168cff;color:#fff;font-weight:800}</style></head><body><main><h1>Sales Tracker PWA Check</h1><p>This page checks the live GitHub Pages files without changing Sales Tracker data.</p><button id="run">Run checks</button><div id="out"></div></main><script>
const out=document.getElementById('out');
function row(name,status,detail,kind){const d=document.createElement('div');d.className='row';const a=document.createElement('div'),b=document.createElement('strong');a.innerHTML='<b>'+name+'</b><br><small></small>';a.querySelector('small').textContent=detail||'';b.textContent=status;b.className=kind;d.append(a,b);out.append(d)}
async function checkFile(path,expected){try{const r=await fetch(path+'?pwa_check='+Date.now(),{cache:'no-store'});const ct=r.headers.get('content-type')||'(none)';row(path,r.status+' '+r.statusText,'Content-Type: '+ct,r.ok&&(expected?ct.includes(expected):true)?'ok':'bad');return r}catch(e){row(path,'FAILED',String(e),'bad');return null}}
async function run(){out.replaceChildren();row('Secure context',isSecureContext?'YES':'NO',location.href,isSecureContext?'ok':'bad');row('Protocol',location.protocol,location.origin,location.protocol==='https:'?'ok':'bad');
const mr=await checkFile('./manifest.webmanifest','json');let m=null;if(mr&&mr.ok){try{m=await mr.clone().json();row('Manifest JSON','VALID','name='+m.name+'; start_url='+m.start_url+'; scope='+m.scope+'; display='+m.display,'ok')}catch(e){row('Manifest JSON','INVALID',String(e),'bad')}}
await checkFile('./sw.js','javascript');
for(const f of ['icon-192.png','icon-512.png','icon-maskable-192.png','icon-maskable-512.png','apple-touch-icon.png','sales-tracker-mobile-splash.jpg'])await checkFile('./'+f,'image');
if('serviceWorker'in navigator){try{const regs=await navigator.serviceWorker.getRegistrations();row('Service worker registrations',String(regs.length),regs.map(r=>r.scope+' | active='+(r.active&&r.active.scriptURL)).join('\n')||'None',regs.length?'ok':'bad');row('Page controlled by service worker',navigator.serviceWorker.controller?'YES':'NO',navigator.serviceWorker.controller?navigator.serviceWorker.controller.scriptURL:'Reload after activation if registration exists',navigator.serviceWorker.controller?'ok':'warn')}catch(e){row('Service worker check','FAILED',String(e),'bad')}}else row('Service worker support','NO','Browser does not expose serviceWorker','bad');
row('Standalone mode',matchMedia('(display-mode: standalone)').matches?'YES':'NO','Expected NO before installation','warn');
const pre=document.createElement('pre');pre.textContent='Copy/screenshot all results above and send them back.';out.append(pre)}
document.getElementById('run').addEventListener('click',run);run();
</script></body></html>
